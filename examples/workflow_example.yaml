# 顺序工作流示例：本地生成 Word。
# 执行一次；定时调度由调用方负责。演示内容不代表当前业务数据。
# 在仓库根目录运行：
#   python -m pip install "acks-office[workflow]"
#   python - <<'PY'
#   from pathlib import Path
#   import yaml
#   from acks_office import OfficeSuite
#   config = yaml.safe_load(Path("examples/workflow_example.yaml").read_text(encoding="utf-8"))
#   result = OfficeSuite().execute_workflow(config)
#   if not result["success"]:
#       raise RuntimeError(result)
#   print(result)
#   PY
name: 本地报告示例
description: 使用实际支持的字段顺序生成文档
steps:
  - name: 生成 Word 报告
    type: document_generate
    config:
      format: docx
      title: "{{ date }} 示例报告"
      content: |
        # 示例内容

        这是顺序工作流生成的演示文档。
      output: "./workflow-report.docx"

# 若已安装 LibreOffice，可在 steps 中添加：
