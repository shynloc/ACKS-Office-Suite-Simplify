[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acks-office"
dynamic = ["version"]
description = "面向 AI Agent 的 Python 办公工具：生成、读取 Word / Excel / PPT / PDF，提供 CLI、doctor 和技能包；格式转换需 LibreOffice。"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thom Jing (shynloc)", email = "mail@jintao.uk" }]
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "pandas>=2.0.0",
    "xlrd>=2.0.1",
    "Pillow>=9.0.0",
    "markdown-it-py>=3.0.0",
]
keywords = [
    "office", "word", "excel", "powerpoint", "pdf", "docx", "xlsx", "pptx",
    "document-generation", "design-system", "ai-agent", "skill", "办公自动化",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Natural Language :: Chinese (Simplified)",
]

[project.optional-dependencies]
fonts = ["fonttools>=4.40"]
workflow = ["requests>=2.28", "PyYAML>=6.0"]
dev = ["pytest>=7.0", "fonttools>=4.40", "requests>=2.28", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/shynloc/ACKS-Office-Suite-Simplify"
Documentation = "https://github.com/shynloc/ACKS-Office-Suite-Simplify/blob/v3.0.0/README.md"
Issues = "https://github.com/shynloc/ACKS-Office-Suite-Simplify/issues"
Changelog = "https://github.com/shynloc/ACKS-Office-Suite-Simplify/blob/main/CHANGELOG.md"

[project.scripts]
acks-office = "acks_office.cli:main"

[tool.setuptools.dynamic]
version = { attr = "acks_office.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acks_office.themes" = ["builtin/*/*.json", "builtin/*/*.md", "builtin/*/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
