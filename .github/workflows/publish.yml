# 发布到 PyPI（手动触发）。
#
# 本仓库已使用 GitHub OIDC 可信发布；仅手动触发，使用 v<版本> 标签。
# 以下配置供迁移或重建环境时参考，不需要保存 API 令牌：
#   PyPI → 账号 → Publishing → Add a new pending publisher
#   PyPI Project Name: acks-office · Owner: shynloc · Repository: ACKS-Office-Suite-Simplify
#   Workflow name: publish.yml · Environment name: pypi
# 现有项目在项目的 Publishing 页配置；首次创建项目才使用 pending publisher。
# GitHub Environment 名为 pypi。
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python tools/check_release_docs.py --tag "${{ github.ref_name }}" --ref-type "${{ github.ref_type }}"
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/acks-office/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
