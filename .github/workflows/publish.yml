# 发布到 PyPI（手动触发）。
#
# 使用前需在 PyPI 配置「可信发布」（Trusted Publishing），不需要也不要保存任何令牌：
#   PyPI → 账号 → Publishing → Add a new pending publisher
#   PyPI Project Name: acks-office · Owner: shynloc · Repository: ACKS-Office-Suite-Simplify
#   Workflow name: publish.yml · Environment name: pypi
# 并在 GitHub 仓库 Settings → Environments 新建名为 pypi 的环境（可设置需要审批）。
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/acks-office/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
