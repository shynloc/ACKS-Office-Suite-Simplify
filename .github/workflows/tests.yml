name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Integration test
        run: python test_integration.py
      - name: CLI smoke test
        shell: bash  # 任何一条命令失败都让这一步失败（Windows 的 pwsh 只看最后一条）
        run: |
          acks-office doctor --json --no-network
          acks-office create pdf -o smoke.pdf --title "冒烟测试" --content "中文 **粗体** 与表格" --json
          python skills/acks-office/scripts/acks.py extract smoke.pdf --json

  bundle:
    name: Skill bundle and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel, sdist and skill bundle
        run: |
          python -m pip install build
          python -m build
          python tools/build_skill_bundle.py --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
